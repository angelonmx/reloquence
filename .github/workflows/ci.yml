name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas-y-lite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio (incluye el submódulo del motor)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instala JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instala Android SDK y NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 37.0.0
          ndk: 26.1.10909125

      - name: Dale permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Pruebas unitarias (no necesitan el motor nativo)
        run: ./gradlew testDebugUnitTest "-Pevvdroid.skipNative=true"

      - name: Compila la edición Lite en la nube
        run: ./gradlew assembleRelease "-Pevvdroid.edition=lite"
